# =============================================================================
#  AI.R public demo — MASTER DATA (example / demo seed)
# =============================================================================
#  FAKE sample dataset so the app runs end-to-end without any real business
#  data. Copy it to `data/master_data.toml` and sync with:
#
#      python -m scripts.import_data
#
#  Material names and colour codes match the vocabulary the UI expects (the
#  Stock screen lays balloons out by catalogue code). People, venue, suppliers
#  and all figures are invented. Values are quoted strings; "" -> NULL.
# =============================================================================

