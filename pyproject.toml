[project]
name = "ai-r"
version = "0.1.0"
description = "Internal management system for AI.R (balloon-installation event business)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    # Web-app auth: password hashing + signed session cookies.
    "bcrypt>=4.1",
    "itsdangerous>=2.1",
    # Monthly money-flow reports rendered to PDF (pure-Python, no system libs).
    "reportlab>=4.0",
    # PostgreSQL driver. Not used while on SQLite, but installed so switching
    # DATABASE_URL to postgresql+psycopg://... works with no code changes.
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",  # required by fastapi.testclient
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.package-data]
app = ["import_spec/*.md"]
